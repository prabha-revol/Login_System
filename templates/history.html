<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sensor History</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: #1e88e5;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 40px;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .title {
            font-size: 28px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        th {
            background-color: #e51ec4;
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            font-size: 20px;
            color: #666;
        }

        .error {
            text-align: center;
            color: red;
            font-size: 20px;
            padding: 20px;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 18px;
            background-color: #1e88e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }

        .back-button:hover {
            background-color: #1565c0;
        }

    </style>

</head>


<body>

    <!-- HEADER -->

    <div class="header">

        <h1>IoT Sensor History</h1>

    </div>


    <!-- MAIN CONTAINER -->

    <div class="container">


        <!-- BACK BUTTON -->

        <button
            id="backDashboard"
            class="back-button"
            type="button">

            ← Back to Dashboard

        </button>


        <!-- TITLE -->

        <div class="title">

            Sensor History

        </div>


        <!-- HISTORY TABLE -->

        <table>

            <thead>

                <tr>

                    <th>Device</th>

                    <th>Type</th>

                    <th>Value</th>

                    <th>Unit</th>

                    <th>Date & Time</th>

                </tr>

            </thead>


            <tbody id="historyTable">

                <!-- History data will be inserted by history.js -->

            </tbody>

        </table>


    </div>


    <!-- JAVASCRIPT -->

    <script src="/static/history.js"></script>

</body>

</html>
