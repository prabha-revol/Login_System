<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sensor History - IoT Monitoring System</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            min-height: 70px;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #0369a1
                );

            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 15px 35px;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.15);
        }


        .logo {
            font-size: 21px;
            font-weight: bold;
        }


        /* =========================
           MAIN
        ========================= */

        .main {
            padding: 30px 35px;
        }


        .title-section {
            margin-bottom: 20px;
        }


        h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }


        .subtitle {
            color: #64748b;
            font-size: 14px;
        }


        /* =========================
           HEADER BACK BUTTON
        ========================= */

        .back-btn {
            border: none;

            background: #475569;

            color: white;

            padding: 10px 17px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;

            font-size: 14px;
        }


        .back-btn:hover {
            background: #334155;
        }


        /* =========================
           HISTORY ACTIONS
        ========================= */

        .history-actions {

            display: flex;

            gap: 10px;

            margin-bottom: 25px;
        }


        /* =========================
           VIEW GRAPH BUTTON
        ========================= */

        .graph-btn {

            border: none;

            background: #0284c7;

            color: white;

            padding: 10px 17px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;

            font-size: 14px;

            transition: 0.2s;
        }


        .graph-btn:hover {

            background: #0369a1;

            transform: translateY(-1px);
        }


        /* =========================
           TABLE CARD
        ========================= */

        .table-card {

            background: white;

            border-radius: 14px;

            padding: 20px;

            box-shadow:
                0 5px 18px
                rgba(15, 23, 42, 0.08);

            border: 1px solid #e2e8f0;

            overflow-x: auto;
        }


        /* =========================
           TABLE
        ========================= */

        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 750px;
        }


        thead {

            background: #e0f2fe;
        }


        th {

            padding: 15px;

            text-align: left;

            color: #075985;

            font-size: 14px;

            white-space: nowrap;
        }


        td {

            padding: 15px;

            border-bottom:
                1px solid #e2e8f0;

            font-size: 14px;

            color: #475569;
        }


        tbody tr:hover {

            background: #f8fafc;
        }


        /* =========================
           SENSOR VALUE
        ========================= */

        td:nth-child(3) {

            font-weight: bold;

            color: #0284c7;
        }


        /* =========================
           UNIT
        ========================= */

        td:nth-child(4) {

            font-weight: bold;

            color: #334155;
        }


        /* =========================
           DATE & TIME
        ========================= */

        td:nth-child(5) {

            white-space: nowrap;

            color: #64748b;
        }


        /* =========================
           EMPTY MESSAGE
        ========================= */

        .empty-message {

            text-align: center;

            padding: 40px;

            color: #64748b;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            .main {

                padding: 20px 15px;
            }


            .header {

                padding: 15px;
            }


            .logo {

                font-size: 17px;
            }


            h1 {

                font-size: 24px;
            }


            .subtitle {

                font-size: 13px;
            }


            .back-btn {

                padding: 8px 12px;

                font-size: 13px;
            }


            .graph-btn {

                padding: 9px 13px;

                font-size: 13px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <div class="logo">

            📡 IoT Monitoring System

        </div>


        <button
            id="backDashboard"
            class="back-btn"
            type="button"
        >

            ← Dashboard

        </button>

    </header>



    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">


        <!-- TITLE -->

        <div class="title-section">

            <h1>
                Sensor History
            </h1>

            <p class="subtitle">

                View historical sensor readings
                from your IoT devices.

            </p>

        </div>



        <!-- =========================
             ACTION BUTTONS
        ========================= -->

        <div class="history-actions">

            <button
                type="button"
                id="graphBtn"
                class="graph-btn"
            >

                📊 View Graph

            </button>

        </div>



        <!-- =========================
             HISTORY TABLE
        ========================= -->

        <div class="table-card">

            <table>

                <thead>

                    <tr>

                        <th>
                            Device Name
                        </th>

                        <th>
                            Device Type
                        </th>

                        <th>
                            Value
                        </th>

                        <th>
                            Unit
                        </th>

                        <th>
                            Date &amp; Time
                        </th>

                    </tr>

                </thead>


                <tbody id="historyTable">

                    <tr>

                        <td
                            colspan="5"
                            class="empty-message"
                        >

                            Loading sensor history...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>



    <!-- =========================
         HISTORY JAVASCRIPT
    ========================= -->

    <script src="/static/history.js?v=2"></script>


</body>

</html>
