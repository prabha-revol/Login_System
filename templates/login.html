<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>IoT Monitoring System</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            background: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        .login-box {

            width: 500px;

            margin: 55px auto;

            padding: 35px 50px;

            background: white;

            border-radius: 12px;

            box-shadow:
                0 2px 12px rgba(0, 0, 0, 0.25);

            box-sizing: border-box;
        }

        h1 {

            text-align: center;

            font-size: 30px;

            margin-bottom: 25px;

            font-weight: 700;
        }

        input {

            width: 100%;

            height: 40px;

            margin-bottom: 15px;

            padding: 0 12px;

            font-size: 15px;

            border: 1px solid #999;

            box-sizing: border-box;

            border-radius: 5px;
        }

        button {

            width: 100%;

            height: 40px;

            background: #2196f3;

            color: white;

            border: none;

            font-size: 16px;

            cursor: pointer;

            border-radius: 5px;
        }

        button:hover {

            background: #1976d2;
        }

        #message {

            text-align: center;

            margin-top: 12px;

            font-size: 16px;

            font-weight: bold;
        }

        .error {

            color: red;
        }

        .success {

            color: green;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <h1>
            IoT Monitoring System
        </h1>


        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >


            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <div id="message"></div>

    </div>


    <script>

        // =====================================================
        // LOGIN FORM
        // =====================================================

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    // =================================================
                    // GET USERNAME
                    // =================================================

                    const username =
                        document
                        .getElementById("username")
                        .value
                        .trim();


                    // =================================================
                    // GET PASSWORD
                    // =================================================

                    const password =
                        document
                        .getElementById("password")
                        .value;


                    // =================================================
                    // MESSAGE ELEMENT
                    // =================================================

                    const message =
                        document
                        .getElementById("message");


                    message.textContent = "";

                    message.className = "";


                    // =================================================
                    // SEND LOGIN REQUEST
                    // =================================================

                    try {

                        console.log(
                            "Logging in user:",
                            username
                        );


                        const response =
                            await fetch(
                                "/API/Login",
                                {

                                    method: "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json"

                                    },

                                    body: JSON.stringify({

                                        username:
                                            username,

                                        password:
                                            password

                                    })

                                }
                            );


                        // =================================================
                        // READ API RESPONSE
                        // =================================================

                        const data =
                            await response.json();


                        console.log(
                            "Login Response:",
                            data
                        );


                        // =================================================
                        // LOGIN SUCCESS
                        // =================================================

                        if (
                            response.ok &&
                            data.message ===
                                "Login successful"
                        ) {


                            // =============================================
                            // SAVE USER ID
                            // =============================================

                            localStorage.setItem(
                                "user_id",
                                data.user_id
                            );


                            // =============================================
                            // SAVE USERNAME
                            // =============================================

                            localStorage.setItem(
                                "username",
                                data.username
                            );


                            // =============================================
                            // SAVE EMAIL
                            // =============================================

                            localStorage.setItem(
                                "email",
                                data.email
                            );


                            // =============================================
                            // SAVE ROLE
                            // =============================================

                            localStorage.setItem(
                                "role",
                                data.role
                            );


                            // =============================================
                            // CHECK SAVED DATA
                            // =============================================

                            console.log(
                                "User ID:",
                                localStorage.getItem(
                                    "user_id"
                                )
                            );

                            console.log(
                                "Username:",
                                localStorage.getItem(
                                    "username"
                                )
                            );

                            console.log(
                                "Email:",
                                localStorage.getItem(
                                    "email"
                                )
                            );

                            console.log(
                                "Role:",
                                localStorage.getItem(
                                    "role"
                                )
                            );


                            // =============================================
                            // SUCCESS MESSAGE
                            // =============================================

                            message.textContent =
                                "Login successful!";

                            message.className =
                                "success";


                            // =============================================
                            // GO TO DASHBOARD
                            // =============================================

                            setTimeout(
                                function() {

                                    window.location.href =
                                        "/dashboard?user_id="
                                        + data.user_id;

                                },
                                500
                            );

                        }


                        // =================================================
                        // LOGIN FAILED
                        // =================================================

                        else {

                            message.textContent =
                                data.detail ||
                                "Invalid Username or Password.";

                            message.className =
                                "error";

                        }

                    }


                    // =====================================================
                    // SERVER ERROR
                    // =====================================================

                    catch (error) {

                        console.error(
                            "Login Error:",
                            error
                        );


                        message.textContent =
                            "Unable to connect to server.";

                        message.className =
                            "error";

                    }

                }
            );

    </script>

</body>

</html>
