<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - IoT Monitoring System</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #0369a1
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }


        /* =========================
           REGISTER CARD
        ========================= */

        .register-card {

            width: 430px;

            background: rgba(255,255,255,0.97);

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.30);
        }


        /* =========================
           ICON
        ========================= */

        .iot-icon {

            text-align: center;

            font-size: 55px;

            margin-bottom: 10px;
        }


        /* =========================
           TITLE
        ========================= */

        h1 {

            text-align: center;

            color: #0f172a;

            font-size: 28px;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 14px;

            margin-bottom: 30px;
        }


        /* =========================
           INPUT GROUP
        ========================= */

        .input-group {

            margin-bottom: 18px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-size: 14px;

            font-weight: bold;
        }


        input {

            width: 100%;

            height: 46px;

            padding: 0 14px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }


        input:focus {

            border-color: #0284c7;

            box-shadow:
                0 0 0 3px
                rgba(14,165,233,0.15);
        }


        /* =========================
           REGISTER BUTTON
        ========================= */

        button {

            width: 100%;

            height: 48px;

            margin-top: 8px;

            border: none;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #0284c7,
                    #0369a1
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(3,105,161,0.30);
        }


        /* =========================
           MESSAGE
        ========================= */

        #message {

            text-align: center;

            margin-top: 15px;

            min-height: 20px;

            font-size: 14px;

            font-weight: bold;
        }


        /* =========================
           LOGIN LINK
        ========================= */

        .login-link {

            text-align: center;

            margin-top: 25px;

            color: #64748b;

            font-size: 14px;
        }


        .login-link a {

            color: #0284c7;

            font-weight: bold;

            text-decoration: none;
        }


        .login-link a:hover {

            text-decoration: underline;
        }


        /* =========================
           HOME LINK
        ========================= */

        .home-link {

            text-align: center;

            margin-top: 18px;
        }


        .home-link a {

            color: #64748b;

            text-decoration: none;

            font-size: 13px;
        }


        .home-link a:hover {

            color: #0284c7;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .register-card {

                width: 100%;

                padding: 30px 25px;
            }

            h1 {

                font-size: 24px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         REGISTER CARD
    ========================= -->

    <div class="register-card">


        <div class="iot-icon">
            👤
        </div>


        <h1>
            Create Account
        </h1>


        <p class="subtitle">
            Register to access the IoT monitoring system
        </p>


        <!-- =========================
             REGISTER FORM
        ========================= -->

        <form id="registerForm">


            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email address"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button type="submit">

                👤 Create Account

            </button>


        </form>


        <!-- =========================
             MESSAGE
        ========================= -->

        <div id="message"></div>


        <!-- =========================
             LOGIN LINK
        ========================= -->

        <div class="login-link">

            Already have an account?

            <a href="/Login">
                Login
            </a>

        </div>


        <!-- =========================
             HOME LINK
        ========================= -->

        <div class="home-link">

            <a href="/">
                ← Back to Home
            </a>

        </div>


    </div>


    <!-- =========================
         REGISTER JAVASCRIPT
    ========================= -->

    <script src="/static/register.js"></script>


</body>

</html>
