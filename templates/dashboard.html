<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>IoT Monitoring Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family: Arial, sans-serif;

            background: #f1f5f9;

            color: #1e293b;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            height: 70px;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #0369a1
                );

            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 35px;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.15);
        }


        .logo {

            font-size: 22px;

            font-weight: bold;
        }


        .user-area {

            display: flex;

            align-items: center;

            gap: 15px;
        }


        #userInfo {

            font-size: 14px;
        }


        .user-id {

            margin-left: 12px;

            opacity: 0.8;
        }


        .logout-btn {

            border: none;

            background: #ef4444;

            color: white;

            padding: 9px 15px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;
        }


        .logout-btn:hover {

            background: #dc2626;
        }


        /* =========================
           MAIN
        ========================= */

        .main {

            padding: 30px 35px;
        }


        .page-title {

            font-size: 28px;

            margin-bottom: 7px;
        }


        .page-subtitle {

            color: #64748b;

            margin-bottom: 25px;
        }


        /* =========================
           TOP ACTIONS
        ========================= */

        .actions {

            display: flex;

            gap: 12px;

            margin-bottom: 25px;

            flex-wrap: wrap;
        }


        .action-btn {

            padding: 11px 18px;

            border: none;

            border-radius: 8px;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }


        .add-btn {

            background: #0284c7;
        }


        .history-btn {

            background: #475569;
        }


        .refresh-btn {

            background: #16a34a;
        }


        .action-btn:hover {

            opacity: 0.9;

            transform: translateY(-1px);
        }


        /* =========================
           SENSOR CONTAINER
        ========================= */

        #sensorContainer {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 22px;
        }


        /* =========================
           DEVICE CARD
        ========================= */

        .sensor-card {

            background: white;

            border-radius: 14px;

            padding: 22px;

            box-shadow:
                0 5px 18px
                rgba(15,23,42,0.08);

            border: 1px solid #e2e8f0;

            transition: 0.25s;
        }


        .sensor-card:hover {

            transform: translateY(-4px);

            box-shadow:
                0 10px 25px
                rgba(15,23,42,0.13);
        }


        .device-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 18px;
        }


        .device-header h2 {

            font-size: 20px;

            display: flex;

            align-items: center;

            gap: 8px;
        }


        .status-dot {

            width: 10px;

            height: 10px;

            background: #22c55e;

            border-radius: 50%;

            display: inline-block;
        }


        .device-menu {

            color: #64748b;

            font-size: 22px;
        }


        .info {

            color: #64748b;

            margin-bottom: 10px;

            font-size: 14px;
        }


        .sensor-value {

            font-size: 36px;

            font-weight: bold;

            color: #0284c7;

            margin: 20px 0;
        }


        .status {

            color: #16a34a;

            font-weight: bold;
        }


        .view-details-btn {

            width: 100%;

            margin-top: 12px;

            padding: 11px;

            border: none;

            border-radius: 7px;

            background: #e0f2fe;

            color: #0369a1;

            font-weight: bold;

            cursor: pointer;
        }


        .view-details-btn:hover {

            background: #bae6fd;
        }


        /* =========================
           MODAL
        ========================= */

        #addDeviceModal {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(15,23,42,0.55);

            justify-content: center;

            align-items: center;

            z-index: 1000;
        }


        .modal-content {

            width: 420px;

            max-width: 90%;

            background: white;

            padding: 30px;

            border-radius: 14px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.25);
        }


        .modal-content h2 {

            margin-bottom: 20px;
        }


        .modal-content input,
        .modal-content select {

            width: 100%;

            padding: 12px;

            margin-bottom: 14px;

            border: 1px solid #cbd5e1;

            border-radius: 7px;
        }


        .modal-actions {

            display: flex;

            gap: 10px;
        }


        .modal-actions button {

            flex: 1;

            padding: 11px;

            border: none;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;
        }


        #closeModal,
        #cancelDevice {

            background: #e2e8f0;

            color: #334155;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            .header {

                padding: 0 15px;
            }

            .main {

                padding: 20px 15px;
            }

            .logo {

                font-size: 18px;
            }

            #userInfo {

                display: none;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <div class="logo">
            📡 IoT Monitoring System
        </div>


        <div class="user-area">

            <div id="userInfo">

                Welcome,
                <span id="username">
                    User
                </span>

                👋

                <span class="user-id">

                    User ID:
                    <span id="userId"></span>

                </span>

            </div>


            <button
                class="logout-btn"
                onclick="logout()"
            >

                Logout

            </button>

        </div>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="main">


        <h1 class="page-title">

            Dashboard

        </h1>


        <p class="page-subtitle">

            Monitor your connected IoT devices and sensor data.

        </p>


        <!-- =========================
             ACTION BUTTONS
        ========================= -->

        <div class="actions">

            <button
                id="addDeviceBtn"
                class="action-btn add-btn"
            >

                + Add Device

            </button>


            <button
                class="action-btn history-btn"
                onclick="openHistory()"
            >

                📊 Sensor History

            </button>


            <button
                class="action-btn refresh-btn"
                onclick="refreshDashboard()"
            >

                🔄 Refresh

            </button>

        </div>


        <!-- =========================
             SENSOR CARDS
        ========================= -->

        <div id="sensorContainer">

            <div class="sensor-card">

                Loading devices...

            </div>

        </div>


    </main>


    <!-- =========================
         ADD DEVICE MODAL
    ========================= -->

    <div id="addDeviceModal">


        <div class="modal-content">


            <h2>
                Add IoT Device
            </h2>


            <input
                type="text"
                id="deviceName"
                placeholder="Device Name"
            >


            <input
                type="text"
                id="deviceType"
                placeholder="Device Type"
            >


            <input
                type="text"
                id="deviceLocation"
                placeholder="Location"
            >


            <div class="modal-actions">

                <button
                    id="cancelDevice"
                    type="button"
                >

                    Cancel

                </button>


                <button
                    id="closeModal"
                    type="button"
                >

                    Close

                </button>

            </div>


            <div id="addDeviceMessage"></div>


        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script src="/static/dashboard.js"></script>


    <script>

        function logout() {

            localStorage.removeItem("user_id");

            localStorage.removeItem("username");

            window.location.href = "/Login";

        }

    </script>


</body>

</html>
